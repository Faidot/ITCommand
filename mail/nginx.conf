# ---------------------------------------------------------------------------
# Example nginx reverse-proxy for TeraMailer
#
# Terminates TLS and forwards everything to the Node backend on :5000, which
# serves the API plus the built webmail (/) and admin (/admin) SPAs.
#
# Put your real certs in place (e.g. via certbot) and adjust server_name.
# ---------------------------------------------------------------------------

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mail.terafort.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.terafort.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/mail.terafort.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.terafort.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Limits ---
    # Must be >= app.maxUploadMb so attachments aren't rejected by nginx.
    client_max_body_size 30m;

    # --- Security headers (the app also sends its own via Helmet) ---
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------------------------------------------------------------------
    # Server-Sent Events: live new-mail stream. Buffering MUST be off or the
    # browser never receives events until the connection closes.
    # ---------------------------------------------------------------------
    location /api/messages/events {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # --- API + static SPAs (all served by the Node backend) ---
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# Alternative: serve the built SPAs directly from nginx and proxy only /api.
# Faster for static assets; use instead of the single "location /" above.
#
#   root /var/www/teramailer/frontend/dist;
#
#   location /api/ { proxy_pass http://127.0.0.1:5000; ...proxy headers... }
#   location /admin/ {
#       alias /var/www/teramailer/admin/dist/;
#       try_files $uri $uri/ /admin/index.html;
#   }
#   location / { try_files $uri $uri/ /index.html; }
# ---------------------------------------------------------------------------
