# ITCommand reverse proxy — the single public entry point (port 80).
#
#   /api/, /admin/   -> Django (Gunicorn)        backend:8000
#   /static/         -> collected static files    (shared volume)
#   /media/          -> user uploads              (shared volume)
#   everything else  -> Next.js frontend          frontend:3000
#
# Because the frontend talks to the API at the relative path "/api", the whole
# app is same-origin: no CORS, and the image works on any domain/IP unchanged.

# Preserve the original protocol from a trusted TLS-terminating proxy (Caddy,
# a load balancer, etc.); fall back to nginx's own connection scheme when the
# upstream did not supply X-Forwarded-Proto.
map $http_x_forwarded_proto $itcommand_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream itcommand_backend {
    server backend:8000;
}

upstream itcommand_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Max upload size (avatars, bill attachments, etc.).
    client_max_body_size 25M;

    # Forwarded headers — inherited by all proxy_pass locations below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $itcommand_forwarded_proto;

    # Django REST API.
    location /api/ {
        proxy_pass http://itcommand_backend;
    }

    # Django admin.
    location /admin/ {
        proxy_pass http://itcommand_backend;
    }

    # Collected static files (Django admin / DRF browsable API).
    location /static/ {
        alias /vol/static/;
        access_log off;
        expires 30d;
    }

    # Raw user uploads are never public. Django validates a short-lived signed
    # /api/media URL, then delegates the bytes to this internal-only location.
    location /media/ {
        return 404;
    }

    location /_protected_media/ {
        internal;
        alias /vol/media/;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    # Next.js frontend (pages, /_next/* assets, public files).
    location / {
        proxy_pass http://itcommand_frontend;
    }
}
