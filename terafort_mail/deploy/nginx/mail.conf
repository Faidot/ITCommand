# mail.itcommand.com
#
# TLS terminates at the host's edge proxy; this vhost sits behind it and
# receives X-Forwarded-Proto. Three routing rules matter:
#
#   /auth/handoff   must accept a cross-site POST from itcommand.com
#   /internal/      must NEVER be reachable from outside the compose network
#   /files/         serves attachments, and is a separate origin in production

server {
    listen 80;
    server_name _;
    client_max_body_size 40m;

    # The ticket travels in a POST body, but belt and braces: never log query
    # strings on the handoff route, in case someone later adds a GET form of it.
    access_log /var/log/nginx/access.log combined;

    # Hard block. The service boundary is for the compose network only; a
    # request that reaches nginx from outside has no business here.
    location /internal/ {
        deny all;
        return 404;
    }

    location /static/ {
        alias /vol/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /auth/handoff {
        proxy_pass http://mail-backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://mail-backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://mail-frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
